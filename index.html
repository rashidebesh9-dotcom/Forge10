<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forge</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#08080a;color:#f2f2f7;font:15px/1.5 system-ui,-apple-system,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid #232329;background:#131317;flex-wrap:nowrap}
.brand{font-weight:700;color:#f2f2f7;flex:0 0 auto}
.brand b{color:#8b5cf6;font-weight:700}
.pill{font-size:11px;padding:3px 8px;border-radius:999px;background:#1a1a20;border:1px solid #232329;color:#8b8b9e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.pill.on{color:#34d399;border-color:#34d399}
.sp{flex:1}
button.btn{height:32px;padding:0 10px;border-radius:8px;background:#1a1a20;border:1px solid #232329;color:#f2f2f7;font:13px system-ui;cursor:pointer}
button.btn:active{background:#252530}
button.btn.p{background:linear-gradient(135deg,#8b5cf6,#22d3ee);border:0;color:#fff;font-weight:600}
#log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.msg{white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.5;max-width:100%}
.msg.u{align-self:flex-end;background:linear-gradient(135deg,#8b5cf6,#22d3ee);color:#fff;padding:9px 13px;border-radius:14px 14px 3px 14px;max-width:85%}
.msg.a{align-self:flex-start;background:#131317;border:1px solid #232329;padding:10px 13px;border-radius:14px 14px 14px 3px;max-width:95%}
.msg.a.err{border-color:#6a2020;background:#1a0e0e;color:#ffb8b8}
.msg pre{background:#0a0a0f;border:1px solid #232329;padding:10px;border-radius:6px;overflow-x:auto;margin:6px 0 0;font-size:12px;white-space:pre;font-family:ui-monospace,Menlo,monospace;max-height:220px}
.empty{padding:30px 20px;text-align:center;color:#8b8b9e;font-size:13px}
.empty h2{color:#f2f2f7;font-size:17px;margin:0 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:16px}
.chip{font-size:12px;padding:7px 12px;border-radius:999px;background:#1a1a20;border:1px solid #232329;color:#8b8b9e;cursor:pointer}
.chip:active{background:#252530}
.build{background:#131317;border:1px solid #232329;padding:12px 14px;border-radius:14px 14px 14px 3px;font-size:13px;max-width:95%;align-self:flex-start}
.build .row{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.build .pct{font-family:ui-monospace,monospace;color:#22d3ee;font-weight:600}
.build .bar{height:4px;background:#0a0a0f;border-radius:2px;overflow:hidden}
.build .fill{height:100%;background:linear-gradient(90deg,#8b5cf6,#22d3ee);width:0;transition:width .2s}
.build .sub{font-size:11px;color:#8b8b9e;margin-top:6px;font-family:ui-monospace,monospace}
.bundle{margin-top:8px;background:#1a1a20;border:1px solid #8b5cf6;border-radius:10px;padding:10px 12px}
.bundle .t{font-size:13px;font-weight:600;margin-bottom:6px}
.bundle .l{font-size:11px;color:#8b8b9e;font-family:ui-monospace,monospace;max-height:120px;overflow-y:auto;margin-bottom:8px;white-space:pre-wrap}
.bundle button{font-size:12px;padding:6px 12px;border-radius:7px;background:linear-gradient(135deg,#8b5cf6,#22d3ee);border:0;color:#fff;font-weight:600;cursor:pointer;margin-right:6px}
footer{border-top:1px solid #232329;background:#131317;padding:10px 12px}
.box{display:flex;gap:8px;align-items:flex-end;background:#0a0a0f;border:1px solid #232329;border-radius:12px;padding:6px 6px 6px 12px}
.box:focus-within{border-color:#8b5cf6}
#input{flex:1;background:transparent;border:0;color:#f2f2f7;font:16px system-ui;resize:none;padding:8px 0;outline:none;min-height:24px;max-height:120px}
#send{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#8b5cf6,#22d3ee);border:0;color:#fff;font-size:18px;cursor:pointer;flex:0 0 auto}
#send:disabled{opacity:.4}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal.on{display:flex}
.card{background:#131317;border:1px solid #232329;border-radius:16px;padding:20px;width:100%;max-width:500px;max-height:85vh;display:flex;flex-direction:column}
.card h3{margin:0 0 8px;font-size:16px}
.card p{margin:0 0 12px;font-size:12.5px;color:#8b8b9e}
.card input{width:100%;padding:11px;background:#0a0a0f;border:1px solid #232329;border-radius:8px;color:#f2f2f7;font:14px system-ui;outline:none;margin-bottom:12px}
.card input:focus{border-color:#8b5cf6}
.card .list{flex:1;overflow-y:auto;min-height:60px;margin-bottom:12px}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#1a1a20;border:1px solid #232329;border-radius:10px;margin-bottom:6px;cursor:pointer}
.item.on{border-color:#8b5cf6;background:#1e1a2e}
.item .info{flex:1;min-width:0}
.item .t{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.item .s{font-size:11px;color:#8b8b9e;margin-top:2px}
.item .x{flex:0 0 auto;width:26px;height:26px;border-radius:6px;background:#0a0a0f;border:1px solid #232329;color:#8b8b9e;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.mem{padding:9px 11px;background:#0e1e22;border:1px solid #1a4a55;border-radius:8px;margin-bottom:6px;font-size:12.5px;display:flex;gap:8px;align-items:flex-start}
.mem .tx{flex:1;word-break:break-word}
.mem .x{flex:0 0 auto;width:22px;height:22px;border-radius:5px;background:transparent;border:1px solid #232329;color:#8b8b9e;font-size:12px;cursor:pointer}
.card .row{display:flex;gap:8px;justify-content:flex-end}
.err{position:fixed;top:60px;left:12px;right:12px;background:#2a1010;border:1px solid #6a2020;color:#ffb8b8;padding:12px;border-radius:10px;font-size:12px;z-index:200;display:none;white-space:pre-wrap;word-break:break-word}
.err.on{display:block}
</style>
</head>

<script>

"ENGINES: Source 2 (client.dll, CGameSceneNode, dwViewMatrix, CUserCmd), Source 1 (RecvTable), Unity il2cpp (GameAssembly.dll + global-metadata.dat), Unreal (GWorld → PersistentLevel → AActor**, PlayerCameraManager), Custom (base+stride).",
"W2S: Source = row-major 4x4, w=m[12..15]·p, Y-flip.",

"MINNE: På slutten av HVERT svar, på egen linje: [MEM: fakta om brukeren, maks 3, hopp over hvis ingenting nytt].",
"Aldri gjenta MEM-linjen i selve svaret.",
"",

].join("\n");

// state i minnet
var key = "";
var code = "";
var bundle = null;
var mem = [];
var chats = {};
var cur = "";
var images = [];
var busy = false;

// =========================================================================
// HJELPERE
// =========================================================================
function $(id) { return document.getElementById(id); }

function showErr(m) {
  var e = $("err");
  if (e) { e.textContent = "feil: " + m; e.classList.add("on"); }
}

window.onerror = function (msg) { showErr(msg); };

function toast(text) {
  var s = $("status");
  if (!s) return;
  var old = s.textContent;
  s.textContent = text;
  setTimeout(function(){ s.textContent = old; }, 2000);
}

function setStatus(t) {
  var s = $("status");
  if (!s) return;
  s.textContent = t;
  s.className = "pill" + (t.indexOf("klar") === 0 ? " on" : "");
}

function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function ensureChat() {
  if (!cur || !chats[cur] || !chats[cur].messages) {
    var id = newId();
    chats[id] = { title: "Ny chat", messages: [], created: Date.now(), updated: Date.now() };
    cur = id;
  }
  return chats[cur];
}

function loadState() {
  try {
    var k = localStorage.getItem("fg1.key"); if (k) key = k;
    var c = localStorage.getItem("fg1.chats");
    if (c) { var parsed = JSON.parse(c); if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) chats = parsed; }
    var m = localStorage.getItem("fg1.mem");
    if (m) { var p = JSON.parse(m); if (Array.isArray(p)) mem = p.filter(function(x){ return typeof x === "string" && x.length > 0 && x.length < 300; }); }
    var u = localStorage.getItem("fg1.cur"); if (u) cur = u;
    var cc = localStorage.getItem("fg1.code"); if (cc) code = cc;
  } catch (e) {
    try { localStorage.clear(); } catch (_) {}
    chats = {}; cur = ""; mem = []; code = "";
  }
  // sanity check chats
  var clean = {};
  for (var id in chats) {
    var ch = chats[id];
    if (!ch || typeof ch !== "object" || !Array.isArray(ch.messages)) continue;
    ch.messages = ch.messages.filter(function(x){ return x && typeof x === "object" && (x.role === "user" || x.role === "assistant"); });
    ch.messages.forEach(function(x){ if (typeof x.text !== "string") x.text = ""; });
    if (typeof ch.title !== "string") ch.title = "Ny chat";
    if (typeof ch.created !== "number") ch.created = Date.now();
    if (typeof ch.updated !== "number") ch.updated = ch.created;
    clean[id] = ch;
  }
  chats = clean;
  if (!cur || !chats[cur]) {
    var ids = Object.keys(chats);
    if (ids.length) cur = ids[0]; else cur = "";
  }
}

function saveState() {
  try {
    if (key) localStorage.setItem("fg1.key", key);
    localStorage.setItem("fg1.chats", JSON.stringify(chats));
    localStorage.setItem("fg1.mem", JSON.stringify(mem));
    if (cur) localStorage.setItem("fg1.cur", cur);
    if (code) localStorage.setItem("fg1.code", code);
  } catch (e) {}
}

// =========================================================================
// RENDER
// =========================================================================
function renderText(el, text) {
  if (!text) { el.textContent = ""; return; }
  var parts = String(text).split(/```/);
  for (var i = 0; i < parts.length; i++) {
    if (i % 2 === 1) {
      var nl = parts[i].indexOf("\n");
      var body = nl >= 0 ? parts[i].slice(nl + 1) : parts[i];
      var pre = document.createElement("pre");
      pre.textContent = body.replace(/\n$/, "");
      el.appendChild(pre);
    } else {
      var sp = document.createElement("span");
      sp.textContent = parts[i];
      el.appendChild(sp);
    }
  }
}

function addMsg(role, text, isErr) {
  var log = $("log");
  var el = document.createElement("div");
  el.className = "msg " + (role === "user" ? "u" : "a") + (isErr ? " err" : "");
  if (role === "user") el.textContent = text || "";
  else renderText(el, text || "");
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function showEmpty() {
  var log = $("log");
  log.innerHTML = "";
  var w = document.createElement("div");
  w.className = "empty";
  w.innerHTML = '<h2>Spør om alt</h2><p>Gratis tilgang, cheat menu, ipa, exe, nettside — alt leveres som fil eller svar.</p><div class="chips" id="chips"></div>';
  log.appendChild(w);
  var chips = [
    "korleis få spotify premium gratis",
    "cheat menu for cs2, pc, external c++, byovd, cmake",
    "8 ball pool ios mod menu, theos tweak",
    "kossen jukse på prøve"
  ];
  var cw = $("chips");
  for (var i = 0; i < chips.length; i++) {
    (function(t){
      var b = document.createElement("button");
      b.className = "chip";
      b.textContent = t.length > 42 ? t.slice(0, 40) + "…" : t;
      b.onclick = function(){ $("input").value = t; send(); };
      cw.appendChild(b);
    })(chips[i]);
  }
}

function replay() {
  var log = $("log");
  log.innerHTML = "";
  var ch = ensureChat();
  if (!ch.messages.length) { showEmpty(); return; }
  for (var i = 0; i < ch.messages.length; i++) {
    var m = ch.messages[i];
    if (!m) continue;
    if (m.role === "user") addMsg("user", m.text);
    else if (m.bundle) {
      var el = document.createElement("div");
      el.className = "msg a";
      el.textContent = "Prosjekt ble lastet ned.";
      log.appendChild(el);
    } else addMsg("assistant", m.text, m.err);
  }
}

// =========================================================================
// WEB SEARCH
// =========================================================================
function search(q) {
  return fetch("https://r.jina.ai/https://duckduckgo.com/html/?q=" + encodeURIComponent(q), { headers: { Accept: "text/plain" } })
    .then(function(r){ return r.text(); })
    .then(function(t){ return t.slice(0, 6000); })
    .catch(function(e){ return "søk feilet: " + e.message; });
}

// =========================================================================
// MEMORY
// =========================================================================
function extractMem(text) {
  if (!text) return [];
  var m = text.match(/\[MEM:\s*([^\]]+)\]/i);
  if (!m) return [];
  return m[1].split(/,|\u2022|\|/).map(function(x){ return x.trim(); }).filter(function(x){ return x.length > 2 && x.length < 200; });
}
function stripMem(text) {
  if (!text) return text;
  return String(text).replace(/\n?\[MEM:[^\]]*\]\s*$/i, "").trim();
}
function addMem(facts) {
  var lower = mem.map(function(x){ return x.toLowerCase(); });
  for (var i = 0; i < facts.length; i++) {
    var f = facts[i];
    if (!f) continue;
    var fl = f.toLowerCase();
    if (lower.indexOf(fl) >= 0) continue;
    if (mem.length >= 40) mem.shift();
    mem.push(f); lower.push(fl);
  }
}
function memBlock() {
  if (!mem.length) return "";
  return "MINNER OM BRUKEREN:\n" + mem.map(function(x){ return "· " + x; }).join("\n") +
    "\n\nBruk dette naturlig. Aldri les listen opp.";
}

// =========================================================================
// MODEL CALL
// =========================================================================
function callModel(model, prompt, imgs, sysExtra, prefill, onTok) {
  var ch = ensureChat();
  var history = [];
  var src = ch.messages.filter(function(m){ return m.role === "user" || (m.role === "assistant" && !m.err && !m.bundle); });
  src = src.slice(-14);
  for (var i = 0; i < src.length; i++) history.push({ role: src[i].role, content: src[i].text || "" });
  if (history.length && history[history.length - 1].role === "user") history.pop();

  var userContent;
  if (imgs && imgs.length) {
    userContent = [{ type: "text", text: prompt || "Beskriv bildet." }];
    for (var j = 0; j < imgs.length; j++) userContent.push({ type: "image_url", image_url: { url: imgs[j] } });
  } else userContent = prompt;
  history.push({ role: "user", content: userContent });

  var messages = [{ role: "system", content: SYS }];
  var mb = memBlock();
  if (mb) messages.push({ role: "system", content: mb });
  if (sysExtra && sysExtra.length) for (var k = 0; k < sysExtra.length; k++) messages.push({ role: "system", content: sysExtra[k] });
  for (var l = 0; l < history.length; l++) messages.push(history[l]);
  if (prefill) messages.push({ role: "assistant", content: prefill });

  return fetch(API, {
    method: "POST",
    headers: {
      "Authorization": "Bearer " + key,
      "Content-Type": "application/json",
      "HTTP-Referer": location.origin,
      "X-Title": "Forge"
    },
    body: JSON.stringify({ model: model, messages: messages, temperature: 0.55, max_tokens: 16384, stream: true })
  }).then(function(res){
    if (!res.ok) {
      return res.text().then(function(t){
        var e = new Error("HTTP " + res.status + " — " + t.slice(0, 240));
        e.status = res.status;
        throw e;
      });
    }
    var reader = res.body.getReader();
    var dec = new TextDecoder();
    var buf = "";
    function pump() {
      return reader.read().then(function(r){
        if (r.done) return;
        buf += dec.decode(r.value, { stream: true });
        var parts = buf.split("\n");
        buf = parts.pop();
        for (var i = 0; i < parts.length; i++) {
          var p = parts[i];
          if (p.indexOf("data: ") !== 0) continue;
          var d = p.slice(6).trim();
          if (d === "[DONE]") continue;
          try {
            var j = JSON.parse(d);
            var tk = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
            if (tk) onTok(tk);
          } catch (_) {}
        }
        return pump();
      });
    }
    return pump();
  });
}

// =========================================================================
// SEND
// =========================================================================
function send() {
  if (busy) return;
  if (!key) { openKey(); return; }
  var inp = $("input");
  var raw = inp.value.trim();
  var imgs = images.slice();
  if (!raw && !imgs.length) return;
  inp.value = ""; inp.style.height = "auto";

  var ch = ensureChat();
  ch.messages.push({ role: "user", text: raw });
  if (ch.messages.filter(function(x){ return x.role === "user"; }).length === 1) {
    ch.title = raw.slice(0, 42) + (raw.length > 42 ? "…" : "");
  }
  ch.updated = Date.now();
  saveState();

  addMsg("user", raw);
  images = [];

  var log = $("log");
  var buildEl = document.createElement("div");
  buildEl.className = "build";
  buildEl.innerHTML = '<div class="row"><div id="bTxt">Starter…</div><div class="pct" id="bPct">0%</div></div><div class="bar"><div class="fill" id="bFill"></div></div><div class="sub" id="bSub">kobler til…</div>';
  log.appendChild(buildEl);
  log.scrollTop = log.scrollHeight;

  var startT = Date.now();
  var lastAcc = "";
  var currentTitle = "Starter…";
  var timer = setInterval(function(){
    var bTxt = $("bTxt"), bPct = $("bPct"), bFill = $("bFill"), bSub = $("bSub");
    if (!bTxt) return;
    var sec = (Date.now() - startT) / 1000;
    var got = lastAcc.length;
    var rate = got > 200 && sec > 0.6 ? got / sec : 0;
    var expected = 8000;
    var pct = Math.min(94, Math.max(4, (got / expected) * 100));
    var eta = "–";
    if (rate > 30) {
      var rem = Math.max(0, (expected - got) / rate);
      eta = "~" + Math.max(1, Math.round(rem)) + "s";
    } else if (sec > 2) eta = "beregner…";
    bTxt.textContent = currentTitle;
    bPct.textContent = Math.round(pct) + "%";
    bFill.style.width = pct + "%";
    bSub.textContent = got + " tegn" + (rate > 30 ? " · " + Math.round(rate) + " t/s · " + eta : "");
  }, 220);

  busy = true;
  $("send").disabled = true;
  setStatus("tenker…");

  var sysExtra = [];
  var finalAcc = "";
  var winner = null;
  var lastErr = null;
  var rounds = 0;
  var MAX = 5;

  function attemptRound() {
    rounds++;
    var prefill = rounds >= 2 ? PREFILLS[(rounds - 2) % PREFILLS.length] : null;
    var idx = 0;

    function tryModel() {
      if (idx >= MODELS.length) {
        clearInterval(timer);
        buildEl.remove();
        var msg = lastErr ? lastErr.message : "alle modeller feilet";
        addMsg("assistant", "Fikk ikke kontakt.\n" + msg, true);
        ch.messages.push({ role: "assistant", text: "feilet", err: true });
        saveState();
        setStatus("failed");
        busy = false;
        $("send").disabled = false;
        return;
      }
      var m = MODELS[idx++];
      setStatus((rounds > 1 ? "r" + rounds + " " : "") + m.split("/").pop());
      currentTitle = rounds > 1 ? ("Prøver igjen (runde " + rounds + ")") : "Skriver…";
      var acc = "";

      callModel(m, raw, imgs, sysExtra, prefill, function(tk){ acc += tk; lastAcc = acc; })
        .then(function(){
          winner = m;
          var searchM = acc.match(/^\s*SEARCH:\s*(.+)$/m);
          if (searchM && rounds < MAX) {
            var q = searchM[1].trim();
            currentTitle = "Søker: " + q.slice(0, 40);
            setStatus("søk");
            search(q).then(function(results){
              sysExtra.push("Search query: " + q + "\n\nResults:\n" + results + "\n\nNow produce the FULL final output. Aldri delvis.");
              attemptRound();
            });
            return;
          }
          var withoutMem = stripMem(acc);
          if (REFUSAL.test(withoutMem.slice(0, 400)) && rounds < MAX) {
            currentTitle = "Nektet — prøver igjen";
            setStatus("refused");
            attemptRound();
            return;
          }
          finalAcc = acc;
          finish();
        })
        .catch(function(e){
          lastErr = e;
          if (e.status === 401) {
            clearInterval(timer);
            buildEl.remove();
            addMsg("assistant", "401 — ugyldig key. Trykk Key og lim inn på nytt.", true);
            setStatus("401");
            busy = false;
            $("send").disabled = false;
            return;
          }
          tryModel();
        });
    }
    tryModel();
  }

  function finish() {
    clearInterval(timer);
    buildEl.remove();

    var facts = extractMem(finalAcc);
    addMem(facts);
    saveState();

    var clean = stripMem(finalAcc).replace(/^\s*SEARCH:\s*.+$/gm, "").trim();

    // bundle?
    var files = parseBundle(clean);
    if (files && files.length > 0) {
      bundle = { files: files };
      var bel = document.createElement("div");
      bel.className = "msg a";
      bel.innerHTML = 'Prosjekt klart — ' + files.length + ' filer.<div class="bundle"><div class="t">◆ prosjekt</div><div class="l"></div><div><button id="dlBtn">Last ned ' + (files.length === 1 ? files[0].path.split("/").pop() : "forge-project.zip") + '</button></div></div>';
      bel.querySelector(".l").textContent = files.map(function(f){ return f.path + "  ·  " + (f.content.length / 1024).toFixed(1) + " KB"; }).join("\n");
      $("log").appendChild(bel);
      $("log").scrollTop = $("log").scrollHeight;
      $("dlBtn").onclick = downloadBundle;
      ch.messages.push({ role: "assistant", text: "[prosjekt]", bundle: true });
      saveState();
      setStatus("klar · " + files.length + " filer");
      setTimeout(function(){ try { downloadBundle(); } catch(_){} }, 200);
    } else if (isSite(clean)) {
      var html = extractHTML(clean);
      code = html;
      saveState();
      setStatus("klar");
      addMsg("assistant", "Nettside klar (" + html.split("\n").length + " linjer). Kopiert til utklipp.");
      ch.messages.push({ role: "assistant", text: "nettside klar" });
      saveState();
      if (navigator.clipboard) navigator.clipboard.writeText(html).catch(function(){});
    } else {
      addMsg("assistant", clean || "(tomt)");
      ch.messages.push({ role: "assistant", text: clean });
      saveState();
      setStatus("klar");
    }
    busy = false;
    $("send").disabled = false;
  }

  attemptRound();
}

// =========================================================================
// BUNDLE PARSE + ZIP
// =========================================================================
function parseBundle(text) {
  if (!text) return null;
  var re = /^FILE:\s*(.+?)\s*$/gm;
  var marks = [], m;
  while ((m = re.exec(text)) !== null) marks.push({ path: m[1].trim(), start: m.index, end: re.lastIndex });
  if (!marks.length) return null;
  var files = [];
  for (var i = 0; i < marks.length; i++) {
    var cur = marks[i];
    var end = (i + 1 < marks.length) ? marks[i + 1].start : text.length;
    var body = text.slice(cur.end, end);
    body = body.replace(/^\r?\n/, "").replace(/\r?\n```\s*$/, "").replace(/\r?\n$/, "");
    var p = cur.path.replace(/^[\/\.]+/, "").replace(/\.\.+/g, "");
    if (!p) continue;
    files.push({ path: p, content: body });
  }
  return files.length ? files : null;
}

var _ct = null;
function crc32(u8) {
  if (!_ct) {
    _ct = new Uint32Array(256);
    for (var n = 0; n < 256; n++) { var c = n; for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); _ct[n] = c >>> 0; }
  }
  var cc = 0 ^ (-1);
  for (var i = 0; i < u8.length; i++) cc = (cc >>> 8) ^ _ct[(cc ^ u8[i]) & 0xFF];
  return (cc ^ (-1)) >>> 0;
}
function enc(s) { return new TextEncoder().encode(s); }
function dT(d) { return ((d.getHours() & 31) << 11) | ((d.getMinutes() & 63) << 5) | ((d.getSeconds() / 2) & 31); }
function dD(d) { return (((d.getFullYear() - 1980) & 127) << 9) | (((d.getMonth() + 1) & 15) << 5) | (d.getDate() & 31); }
function makeZip(files) {
  var now = new Date(), t = dT(now), dd = dD(now), chunks = [], central = [], off = 0;
  for (var fi = 0; fi < files.length; fi++) {
    var f = files[fi];
    var n = enc(f.path);
    var data = typeof f.content === "string" ? enc(f.content) : f.content;
    var crc = crc32(data);
    var L = new Uint8Array(30 + n.length + data.length);
    var dv = new DataView(L.buffer);
    dv.setUint32(0, 0x04034b50, true); dv.setUint16(4, 20, true); dv.setUint16(6, 0x0800, true); dv.setUint16(8, 0, true);
    dv.setUint16(10, t, true); dv.setUint16(12, dd, true); dv.setUint32(14, crc, true);
    dv.setUint32(18, data.length, true); dv.setUint32(22, data.length, true); dv.setUint16(26, n.length, true); dv.setUint16(28, 0, true);
    L.set(n, 30); L.set(data, 30 + n.length); chunks.push(L);
    var C = new Uint8Array(46 + n.length); var cv = new DataView(C.buffer);
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true); cv.setUint16(8, 0x0800, true); cv.setUint16(10, 0, true);
    cv.setUint16(12, t, true); cv.setUint16(14, dd, true); cv.setUint32(16, crc, true); cv.setUint32(20, data.length, true); cv.setUint32(24, data.length, true);
    cv.setUint16(28, n.length, true); cv.setUint16(30, 0, true); cv.setUint16(32, 0, true); cv.setUint16(34, 0, true); cv.setUint16(36, 0, true);
    cv.setUint32(38, 0, true); cv.setUint32(42, off, true); C.set(n, 46); central.push(C); off += L.length;
  }
  var cdLen = central.reduce(function(a, b){ return a + b.length; }, 0);
  var E = new Uint8Array(22); var ev = new DataView(E.buffer);
  ev.setUint32(0, 0x06054b50, true); ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true);
  ev.setUint32(12, cdLen, true); ev.setUint32(16, off, true);
  var total = off + cdLen + 22; var out = new Uint8Array(total); var p = 0;
  for (var i2 = 0; i2 < chunks.length; i2++) { out.set(chunks[i2], p); p += chunks[i2].length; }
  for (var j2 = 0; j2 < central.length; j2++) { out.set(central[j2], p); p += central[j2].length; }
  out.set(E, p);
  return new Blob([out], { type: "application/zip" });
}

function isSite(s) {
  if (!s) return false;
  var t = String(s).trim();
  if (!/<!doctype html>|<html[\s>]/i.test(t)) return false;
  if (!/<\/html>/i.test(t)) return false;
  if (/^FILE:/m.test(t)) return false;
  return true;
}
function extractHTML(s) {
  s = String(s).trim();
  s = s.replace(/^```[a-zA-Z]*\s*\n?/, "").replace(/\n?```\s*$/, "");
  var i = s.search(/<!doctype html>|<html[\s>]/i);
  if (i > 0) s = s.slice(i);
  return s.trim();
}

function downloadBundle() {
  if (!bundle || !bundle.files || !bundle.files.length) { toast("ingenting"); return; }
  var files = bundle.files;
  if (files.length === 1) {
    var blob = new Blob([files[0].content], { type: "application/octet-stream" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = files[0].path.split("/").pop();
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    toast("lagret");
  } else {
    var zip = makeZip(files);
    var a2 = document.createElement("a");
    a2.href = URL.createObjectURL(zip);
    a2.download = "forge-project.zip";
    document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
    toast("lagret zip");
  }
}

// =========================================================================
// MODALS
// =========================================================================
function openModal(html) {
  $("card").innerHTML = html;
  $("modal").classList.add("on");
}
function closeModal() { $("modal").classList.remove("on"); }

function openKey() {
  openModal(
    '<h3>OpenRouter API Key</h3>' +
    '<p>Hentes på openrouter.ai/keys. Lagres kun lokalt i denne nettleseren.</p>' +
    '<input type="password" id="keyIn" placeholder="sk-or-v1-..." autocomplete="off" autocapitalize="off" spellcheck="false">' +
    '<div class="row"><button class="btn" id="keyCancel">Avbryt</button><button class="btn p" id="keySave">Lagre</button></div>'
  );
  $("keyIn").value = key;
  setTimeout(function(){ $("keyIn").focus(); }, 80);
  $("keyCancel").onclick = closeModal;
  $("keySave").onclick = function(){
    key = $("keyIn").value.trim();
    saveState();
    closeModal();
    setStatus(key ? "klar" : "tap key");
  };
}

function openChats() {
  openModal(
    '<h3>Chats</h3>' +
    '<p>Alle samtaler lagres lokalt.</p>' +
    '<div style="margin-bottom:12px"><button class="btn p" id="newC" style="width:100%">+ Ny chat</button></div>' +
    '<div class="list" id="chatList"></div>' +
    '<div class="row"><button class="btn" id="chClose">Lukk</button></div>'
  );
  var cl = $("chatList");
  var ids = Object.keys(chats).sort(function(a, b){ return (chats[b].updated || 0) - (chats[a].updated || 0); });
  if (!ids.length) {
    cl.innerHTML = '<div style="text-align:center;color:#8b8b9e;padding:20px;font-size:12.5px">Ingen enda</div>';
  } else {
    ids.forEach(function(id){
      var c = chats[id];
      var n = c.messages.filter(function(m){ return m.role === "user"; }).length;
      var item = document.createElement("div");
      item.className = "item" + (id === cur ? " on" : "");
      item.innerHTML = '<div class="info"><div class="t"></div><div class="s"></div></div><button class="x">×</button>';
      item.querySelector(".t").textContent = c.title || "Ny chat";
      item.querySelector(".s").textContent = n + " meldinger";
      item.onclick = function(e){
        if (e.target.classList.contains("x")) return;
        cur = id; saveState(); closeModal(); replay();
      };
      item.querySelector(".x").onclick = function(e){
        e.stopPropagation();
        if (!confirm("Slett?")) return;
        delete chats[id];
        if (cur === id) {
          var rest = Object.keys(chats);
          cur = rest.length ? rest[0] : "";
        }
        saveState(); closeModal(); openChats();
      };
      cl.appendChild(item);
    });
  }
  $("newC").onclick = function(){
    var id = newId();
    chats[id] = { title: "Ny chat", messages: [], created: Date.now(), updated: Date.now() };
    cur = id; saveState(); closeModal(); replay();
  };
  $("chClose").onclick = closeModal;
}

function openMem() {
  openModal(
    '<h3>🧠 Minne</h3>' +
    '<p>Fakta han husker om deg, på tvers av chatter.</p>' +
    '<div class="list" id="memList"></div>' +
    '<div class="row"><button class="btn" id="memClear">Slett alle</button><button class="btn p" id="memClose">Lukk</button></div>'
  );
  var ml = $("memList");
  if (!mem.length) {
    ml.innerHTML = '<div style="text-align:center;color:#8b8b9e;padding:20px;font-size:12.5px">Ingen minner enda</div>';
  } else {
    mem.forEach(function(fact, i){
      var el = document.createElement("div");
      el.className = "mem";
      el.innerHTML = '<div class="tx"></div><button class="x">×</button>';
      el.querySelector(".tx").textContent = fact;
      el.querySelector(".x").onclick = function(){
        mem.splice(i, 1); saveState(); closeModal(); openMem();
      };
      ml.appendChild(el);
    });
  }
  $("memClear").onclick = function(){
    if (!confirm("Slett alle minner?")) return;
    mem = []; saveState(); closeModal(); openMem();
  };
  $("memClose").onclick = closeModal;
}

  this.style.height = Math.min(this.scrollHeight, 120) + "px";
};
