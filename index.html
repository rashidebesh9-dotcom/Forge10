<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ny chat</title>
    <style>
        /* Enkel og ren styling for å matche bildet */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            height: 100%;
            display: flex;
            flex-direction: column;
            background-color: #0d0d0d;
        }

        /* Toppmeny */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            font-size: 16px;
            font-weight: 500;
            border-bottom: 1px solid #1c1c1e;
        }

        .header-title {
            font-size: 16px;
        }

        .icon {
            font-size: 20px;
        }

        /* Chatteområde */
        .chat-area {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .bot-message {
            font-size: 16px;
            line-height: 1.4;
        }

        .user-message {
            align-self: flex-end;
            background-color: #2c2c2e;
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 85%;
            font-size: 15px;
            line-height: 1.4;
        }

        /* Bunnmeny med input-felt */
        .input-area {
            padding: 15px 20px 25px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            background-color: #0d0d0d;
        }

        .add-btn {
            background: none;
            border: none;
            color: #a0a0a0;
            font-size: 24px;
            padding-bottom: 4px;
        }

        .text-input {
            flex: 1;
            background-color: #1c1c1e;
            border: none;
            border-radius: 20px;
            padding: 12px 18px;
            color: #fff;
            font-size: 16px;
            outline: none;
        }

        .send-btn {
            background-color: #ff4d4d;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Topp -->
        <div class="header">
            <div class="icon">☰</div>
            <div class="header-title">Ny chat</div>
            <div class="icon">✎</div>
        </div>

        <!-- Chatteområde -->
        <div class="chat-area">
            <!-- Melding fra boten -->
            <div class="bot-message">Hei! Hva kan jeg hjelpe med?</div>
            
            <!-- Meldingen du sa -->
            <div class="user-message">Nei den fuste finke så eg tror eg bare møtte vente litt mer</div>
        </div>

        <!-- Bunn med input -->
        <div class="input-area">
            <button class="add-btn">+</button>
            <input type="text" class="text-input" value="Hei" readonly>
            <button class="send-btn">↑</button>
        </div>
    </div>

</body>
</html>
