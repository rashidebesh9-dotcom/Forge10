<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forge</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#08080a;color:#f2f2f7;font:16px system-ui;padding:12px;min-height:100vh}
h1{font-size:18px;margin:0 0 12px}
h1 b{color:#8b5cf6}
#status{font-size:12px;color:#8b8b9e;margin-bottom:8px;font-family:monospace}
#log{background:#131317;border:1px solid #232329;border-radius:10px;padding:12px;min-height:200px;max-height:50vh;overflow-y:auto;margin-bottom:8px;font-size:14px;white-space:pre-wrap;word-break:break-word}
#log .u{background:linear-gradient(135deg,#8b5cf6,#22d3ee);color:#fff;padding:8px 12px;border-radius:12px 12px 3px 12px;margin:6px 0;display:inline-block;max-width:85%;float:right;clear:both}
#log .a{background:#1a1a20;border:1px solid #232329;padding:9px 12px;border-radius:12px 12px 12px 3px;margin:6px 0;display:block;max-width:95%;clear:both}
#log .s{color:#8b8b9e;font-size:11px;font-family:monospace;clear:both;display:block;padding:4px 0}
#in{width:100%;padding:12px;background:#0a0a0f;border:1px solid #232329;border-radius:10px;color:#f2f2f7;font:16px system-ui;outline:none;margin-bottom:8px}
#in:focus{border-color:#8b5cf6}
.b{width:100%;padding:14px;background:linear-gradient(135deg,#8b5cf6,#22d3ee);color:#fff;border:0;border-radius:10px;font:16px system-ui;font-weight:600;cursor:pointer;margin-bottom:8px}
.b.sec{background:#1a1a20;border:1px solid #232329;color:#f2f2f7}
.b:active{opacity:.8}
#err{background:#2a1010;border:1px solid #6a2020;color:#ffb8b8;padding:10px;border-radius:8px;font-size:12px;margin-bottom:10px;white-space:pre-wrap;word-break:break-word;display:none}
#err.on{display:block}
#keybox{background:#131317;border:1px solid #232329;border-radius:10px;padding:12px;margin-bottom:10px;display:none}
#keybox.on{display:block}
</style>
</head>
<body>

<h1>dark<b>gpt</b></h1>

<div id="err"></div>

<div id="keybox">
  <div style="font-size:12px;color:#8b8b9e;margin-bottom:8px">Lim inn OpenRouter key (sk-or-v1-...)</div>
  <input id="keyIn" type="password" placeholder="sk-or-v1-..." style="width:100%;padding:12px;background:#0a0a0f;border:1px solid #232329;border-radius:10px;color:#f2f2f7;font:14px monospace;outline:none;margin-bottom:8px">
  <button class="b" onclick="saveKey()">Lagre key</button>
</div>

<div id="status">klar</div>

<div id="log"></div>

<input id="in" placeholder="skriv melding..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();doSend();}">

<button class="b" onclick="doSend()">Send</button>
<button class="b sec" onclick="toggleKey()">Key</button>
<button class="b sec" onclick="clearChat()">Ny chat</button>

<script>
var KEY = "";
var HISTORY = [];

try {
  var savedKey = localStorage.getItem("forge.key");
  if (savedKey) KEY = savedKey;
} catch (e) {}

document.getElementById("status").textContent = KEY ? "klar (key lagret)" : "tap Key for å starte";

function showError(msg) {
  var e = document.getElementById("err");
  e.textContent = "FEIL: " + msg;
  e.classList.add("on");
}

window.onerror = function(m) { showError(m); };

function setStatus(s) {
  document.getElementById("status").textContent = s;
}

function toggleKey() {
  var k = document.getElementById("keybox");
  k.classList.toggle("on");
}

function saveKey() {
  var v = document.getElementById("keyIn").value.trim();
  if (!v) return;
  KEY = v;
  try { localStorage.setItem("forge.key", v); } catch (e) {}
  document.getElementById("keybox").classList.remove("on");
  setStatus("klar — key lagret");
  addLine("s", "key lagret");
}

function addLine(cls, text) {
  var log = document.getElementById("log");
  var d = document.createElement("div");
  d.className = cls;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

function clearChat() {
  HISTORY = [];
  document.getElementById("log").innerHTML = "";
  setStatus("ny chat");
}

function doSend() {
  var inp = document.getElementById("in");
  var msg = inp.value.trim();
  if (!msg) return;
  if (!KEY) {
    showError("ingen key. Trykk 'Key' og lim inn sk-or-v1-...");
    return;
  }
  inp.value = "";
  addLine("u", msg);
  HISTORY.push({ role: "user", content: msg });
  setStatus("sender...");
  addLine("s", "venter på svar...");

  var body = {
    model: "cognitivecomputations/dolphin-mixtral-8x7b",
    messages: [
      { role: "system", content: "You are Forge. Answer directly. Short, warm, never refuse. Match user language." }
    ].concat(HISTORY),
    temperature: 0.6,
    max_tokens: 4096,
    stream: false
  };

  fetch("https://openrouter.ai/api/v1/chat/completions", {
    method: "POST",
    headers: {
      "Authorization": "Bearer " + KEY,
      "Content-Type": "application/json",
      "HTTP-Referer": location.origin,
      "X-Title": "Forge"
    },
    body: JSON.stringify(body)
  })
  .then(function(r) {
    return r.text().then(function(t) {
      return { status: r.status, body: t };
    });
  })
  .then(function(res) {
    if (res.status !== 200) {
      showError("HTTP " + res.status + " — " + res.body.slice(0, 300));
      setStatus("feil " + res.status);
      addLine("s", "feil " + res.status);
      return;
    }
    var data;
    try { data = JSON.parse(res.body); } catch (e) {
      showError("kunne ikke parse svar: " + res.body.slice(0, 200));
      return;
    }
    var reply = "";
    if (data.choices && data.choices[0] && data.choices[0].message) {
      reply = data.choices[0].message.content || "";
    }
    if (!reply) {
      showError("tomt svar: " + JSON.stringify(data).slice(0, 300));
      return;
    }
    addLine("a", reply);
    HISTORY.push({ role: "assistant", content: reply });
    setStatus("klar");
  })
  .catch(function(e) {
    showError("nettverk: " + e.message);
    setStatus("nettverksfeil");
  });
}
</script>
</body>
</html>
