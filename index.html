<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI</title>
<style>
body{margin:0;padding:12px;background:#111;color:#eee;font:16px system-ui}
h2{margin:0 0 8px;font-size:18px}
button{padding:12px;font:16px system-ui;border-radius:8px;border:0;cursor:pointer;margin:2px 0}
.b1{background:#8b5cf6;color:#fff;width:100%}
.b2{background:#333;color:#eee;width:100%}
input{width:100%;padding:12px;font:16px system-ui;background:#1a1a1a;color:#eee;border:1px solid #333;border-radius:8px;box-sizing:border-box;margin:4px 0}
#log{background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:10px;height:40vh;overflow-y:auto;margin:8px 0;white-space:pre-wrap;word-break:break-word;font-size:14px}
#log .u{color:#a78bfa;margin:6px 0}
#log .a{color:#e0e0e0;margin:6px 0}
#log .s{color:#888;margin:6px 0;font-size:12px}
</style>
</head>
<body>

<h2>AI</h2>

<div id="log"></div>

<input id="keyin" type="password" placeholder="sk-or-v1-... (key)">
<button class="b1" onclick="saveKey()">Lagre key</button>

<input id="msg" placeholder="skriv melding...">
<button class="b1" onclick="send()">Send</button>
<button class="b2" onclick="clr()">Tøm</button>

<script>
var KEY = "";
var HIST = [];

function log(cls, text) {
  var el = document.getElementById("log");
  var d = document.createElement("div");
  d.className = cls;
  d.textContent = text;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
}

function saveKey() {
  var v = document.getElementById("keyin").value;
  if (!v) { alert("tom key"); return; }
  KEY = v;
  try { localStorage.setItem("k", v); } catch (e) {}
  log("s", "key lagret (" + KEY.length + " tegn)");
  document.getElementById("keyin").value = "";
}

function clr() {
  HIST = [];
  document.getElementById("log").innerHTML = "";
}

function send() {
  var box = document.getElementById("msg");
  var text = box.value;
  if (!text) return;
  if (!KEY) { alert("lim inn key først"); return; }
  box.value = "";
  log("u", "du: " + text);
  log("s", "venter...");

  HIST.push({ role: "user", content: text });

  var payload = {
    model: "openrouter/free",
    messages: HIST,
    max_tokens: 2048
  };

  var xhr = new XMLHttpRequest();
  xhr.open("POST", "https://openrouter.ai/api/v1/chat/completions", true);
  xhr.setRequestHeader("Authorization", "Bearer " + KEY);
  xhr.setRequestHeader("Content-Type", "application/json");

  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) return;
    if (xhr.status !== 200) {
      log("s", "FEIL " + xhr.status + ": " + xhr.responseText.slice(0, 400));
      return;
    }
    var data;
    try { data = JSON.parse(xhr.responseText); }
    catch (e) { log("s", "parse feil: " + xhr.responseText.slice(0, 200)); return; }

    var reply = "";
    if (data.choices && data.choices.length > 0 && data.choices[0].message) {
      reply = data.choices[0].message.content || "";
    }
    if (!reply) { log("s", "tomt svar: " + xhr.responseText.slice(0, 300)); return; }
    log("a", "ai: " + reply);
    HIST.push({ role: "assistant", content: reply });
  };

  xhr.onerror = function() { log("s", "nettverksfeil"); };
  xhr.send(JSON.stringify(payload));
}

try {
  var s = localStorage.getItem("k");
  if (s) { KEY = s; log("s", "key fra minne (" + KEY.length + " tegn)"); }
} catch (e) {}
</script>
</body>
</html>
